name: phase4-temporary-acceptance

on:
  push:
    branches:
      - phase4-export
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-temporary-acceptance
  cancel-in-progress: false

jobs:
  phase4-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install DuckDB Python reader
        run: python3 -m pip install --disable-pip-version-check duckdb

      - name: Record environment
        run: |
          set -euxo pipefail
          go version
          python3 --version
          python3 - <<'PY'
          import duckdb
          print('duckdb', duckdb.__version__)
          PY

      - name: Run Phase 4 acceptance gate
        shell: bash
        run: |
          set -o pipefail
          ./scripts/acceptance.sh 4 2>&1 | tee phase4-acceptance.log

      - name: Upload acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-acceptance-log
          path: phase4-acceptance.log
          if-no-files-found: warn
