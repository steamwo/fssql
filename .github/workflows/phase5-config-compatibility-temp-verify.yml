name: phase5-config-compatibility-temp-verify

on:
  push:
    branches:
      - phase-5-config-compatibility

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gofmt check
        run: |
          files="$(gofmt -l internal/settings/compatibility_test.go)"
          printf '%s\n' "$files"
          test -z "$files"
      - name: Config compatibility acceptance
        run: bash ./scripts/phase5-config-compatibility.sh
      - name: Architecture boundary check
        run: go run ./tools/architecture-check
