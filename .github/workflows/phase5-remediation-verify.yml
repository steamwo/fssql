name: phase5-remediation-verify

on:
  push:
    branches:
      - phase5-remediation-adr0008

permissions:
  contents: read

jobs:
  phase5-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
      - name: Install pinned DuckDB reference
        run: python3 -m pip install --disable-pip-version-check 'duckdb==2.0.0'
      - name: Run complete Phase 5 acceptance
        run: bash ./scripts/acceptance.sh phase-5
