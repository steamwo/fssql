name: phase0-bootstrap
permissions:
  contents: write
on:
  push:
    branches: ["phase0/t01-kernel-skeleton"]
jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified Phase 0 payload
        run: |
          cat .phase0-payload.part-* | base64 -d > /tmp/phase0.tar.gz
          tar -xzf /tmp/phase0.tar.gz
          rm .phase0-payload.part-*
          rm .github/workflows/phase0-bootstrap.yml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./tools/architecture-check .
      - run: go test -race ./...
      - name: Commit Phase 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "phase0: complete kernel PoC and acceptance gates"
          git push origin HEAD:phase0/t01-kernel-skeleton
