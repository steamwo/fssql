name: phase5-server-core-temp-verify

on:
  push:
    branches:
      - phase-5-server-api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gofmt check
        run: test -z "$(gofmt -l internal/server)"
      - name: Query service tests
        run: go test -count=1 ./internal/server ./internal/query ./internal/resource
      - name: Query service race tests
        run: go test -race -count=1 ./internal/server ./internal/query ./internal/resource
      - name: Architecture boundary check
        run: go run ./tools/architecture-check
