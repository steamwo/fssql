name: Verify

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  go:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.12'
      - run: go test -count=1 ./...
      - run: go run ./tools/architecture-check
      - if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  duckdb:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.12'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install reference engine and Parquet writer
        run: python -m pip install 'duckdb==2.0.0' 'pyarrow==24.0.0'
      - name: Run pull request differential tests
        if: github.event_name == 'pull_request'
        run: python tools/check-duckdb.py --pr
      - name: Run required differential and file interoperability tests
        if: github.event_name != 'pull_request'
        run: python tools/check-duckdb.py
