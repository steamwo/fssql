name: phase0
on:
  push:
    branches: ["phase0/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./tools/architecture-check .
      - run: go test -race ./...
