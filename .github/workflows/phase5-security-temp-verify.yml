name: phase5-security-temp-verify

on:
  push:
    branches:
      - phase-5-security-suite

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Security acceptance
        run: bash ./scripts/phase5-security.sh
      - name: Architecture boundary check
        run: go run ./tools/architecture-check
