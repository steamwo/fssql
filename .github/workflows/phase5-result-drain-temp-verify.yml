name: phase5-result-drain-temp-verify

on:
  push:
    branches:
      - phase-5-result-drain-ownership

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gofmt check
        run: |
          files="$(gofmt -l \
            internal/server/result_cursor.go \
            internal/server/result_cursor_wait.go \
            internal/server/query_service.go \
            internal/server/http_api.go \
            internal/server/result_cursor_test.go \
            internal/server/query_service_lifecycle_test.go \
            internal/server/stability_test.go \
            internal/server/result_cursor_benchmark_test.go)"
          printf '%s\n' "$files"
          test -z "$files"
      - name: Server tests
        run: go test -count=1 ./internal/server
      - name: Server race tests repeated
        run: go test -race -count=3 ./internal/server
      - name: Architecture boundary check
        run: go run ./tools/architecture-check
      - name: Result hot-path benchmarks
        run: go test -run '^$' -bench 'Benchmark(ResultCursorPushNext|ParseQueryPath)$' -benchmem -benchtime=100ms ./internal/server
