name: phase5-source-inspect-temp-verify

on:
  push:
    branches:
      - phase-5-source-inspect-api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gofmt check
        run: |
          files="$(gofmt -l \
            internal/introspection/service.go \
            internal/introspection/service_test.go \
            internal/format/csv/spec_inspector.go \
            internal/format/csv/spec_inspector_test.go \
            internal/format/parquet/spec_inspector.go \
            internal/format/parquet/spec_inspector_test.go \
            internal/server/source_inspect_http.go \
            internal/server/source_inspect_http_test.go)"
          printf '%s\n' "$files"
          test -z "$files"
      - name: Source inspect tests
        run: go test -count=1 ./internal/introspection ./internal/format/csv ./internal/format/parquet ./internal/server
      - name: Source inspect race tests
        run: go test -race -count=1 ./internal/introspection ./internal/format/csv ./internal/format/parquet ./internal/server
      - name: Architecture boundary check
        run: go run ./tools/architecture-check
