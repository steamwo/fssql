name: phase5-stability-temp-verify

on:
  push:
    branches:
      - phase-5-stability

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gofmt check
        run: |
          files="$(gofmt -l internal/server/stability_test.go)"
          printf '%s\n' "$files"
          test -z "$files"
      - name: Long-running stability acceptance
        run: bash ./scripts/phase5-stability.sh
