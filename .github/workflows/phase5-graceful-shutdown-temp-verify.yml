name: phase5-graceful-shutdown-temp-verify

on:
  push:
    branches:
      - phase-5-graceful-shutdown

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gofmt check
        run: |
          files="$(gofmt -l internal/server/shutdown.go internal/server/shutdown_test.go)"
          printf '%s\n' "$files"
          test -z "$files"
      - name: Graceful shutdown tests
        run: go test -count=1 ./internal/server ./internal/resource ./internal/query
      - name: Graceful shutdown race tests
        run: go test -race -count=1 ./internal/server ./internal/resource ./internal/query
      - name: Architecture boundary check
        run: go run ./tools/architecture-check
