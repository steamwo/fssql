name: publish-v1-stable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-v1-stable-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          check-latest: false
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned release interoperability matrix
        run: python -m pip install --disable-pip-version-check 'pyarrow==26.0.0' 'duckdb==2.0.0' 'polars==2.1.0' 'pyspark==4.3.0'
      - name: Verify release shell syntax
        run: bash -n ./scripts/acceptance.sh ./scripts/phase6-release.sh ./scripts/phase6-publish-v1.sh
      - name: Run Phase 6 Feature Freeze release gate
        run: bash ./scripts/acceptance.sh phase-6

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish verified v1.0 Stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash ./scripts/phase6-publish-v1.sh
