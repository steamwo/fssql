name: phase5-acceptance-temp-verify

on:
  push:
    branches:
      - phase-5-acceptance-final

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Phase 5 full acceptance
        run: bash ./scripts/acceptance.sh 5
