name: phase1

on:
  push:
    branches: ["phase1-s3-parquet"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./tools/architecture-check .
      - run: go test -race ./...
