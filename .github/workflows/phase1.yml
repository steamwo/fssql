name: phase1

on:
  push:
    branches: ["phase1-s3-parquet"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./tools/architecture-check .
      - run: go test -race ./...
      - name: Phase 1 Parquet benchmark baseline
        run: |
          mkdir -p artifacts/phase-1/runtime
          go test ./internal/format/parquet -run '^$' -bench '^BenchmarkRowGroupScannerInt32_1024$' -benchmem -count=3 | tee artifacts/phase-1/runtime/benchmark-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-benchmark-evidence
          path: artifacts/phase-1/runtime/benchmark-output.txt
          if-no-files-found: error

  interop:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install --upgrade pip
      - name: Install pinned Phase 1 interop engines
        run: python -m pip install pyarrow==26.0.0 duckdb==2.0.0 polars==2.1.0 pyspark==4.3.0
      - name: Run Phase 1 interop matrix
        run: |
          mkdir -p artifacts/phase-1/runtime
          python test/interop/phase1/run.py | tee artifacts/phase-1/runtime/interop-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-interop-evidence
          path: artifacts/phase-1/runtime/interop-output.txt
          if-no-files-found: error
