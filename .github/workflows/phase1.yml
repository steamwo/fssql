name: phase1

on:
  push:
    branches: ["phase1-s3-parquet"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./tools/architecture-check .
      - run: go test -race ./...

  interop:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pyarrow duckdb polars pyspark
      - run: python test/interop/phase1/run.py
