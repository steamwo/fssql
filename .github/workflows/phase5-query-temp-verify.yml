name: phase5-query-temp-verify

on:
  push:
    branches:
      - phase-5-query-lifecycle

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gofmt check
        run: test -z "$(gofmt -l internal/server internal/query)"
      - name: Query lifecycle tests
        run: go test -count=1 ./internal/server ./internal/query
      - name: Query lifecycle race tests
        run: go test -race -count=1 ./internal/server ./internal/query
      - name: Architecture boundary check
        run: go run ./tools/architecture-check
