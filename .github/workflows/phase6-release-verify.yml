name: phase6-release-verify

on:
  push:
    branches:
      - main
      - phase5-remediation-adr0008
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          check-latest: false
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned release interoperability matrix
        run: python -m pip install --disable-pip-version-check 'pyarrow==26.0.0' 'duckdb==2.0.0' 'polars==2.1.0' 'pyspark==4.3.0'
      - name: Verify shell syntax
        run: bash -n ./scripts/acceptance.sh ./scripts/phase6-release.sh
      - name: Run Phase 6 Feature Freeze release gate
        run: bash ./scripts/acceptance.sh phase-6
