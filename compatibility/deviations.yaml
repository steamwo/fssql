{
  "schema_version": 1,
  "reference": {
    "engine": "duckdb",
    "version": "2.0.0"
  },
  "entries": [
    {
      "id": "DBSQL-001",
      "classification": "unsupported_feature",
      "surface": "database/sql transaction and parameterized statement boundaries",
      "stable_sql_semantics": false,
      "summary": "SELECT parameter binding and prepared syntax are supported; transactions and parameterized DDL/COPY remain unsupported.",
      "duckdb": "DuckDB client APIs support parameter binding, prepared statements and transactions.",
      "fssql": "QueryContext/ExecContext and prepared SELECT statements bind ?, numbered or named placeholders as AST values. Begin/BeginTx explicitly reject transactions; DDL/COPY with parameters is rejected.",
      "rationale": "Parsed statement templates can be reused safely with independent execution resources. Atomic catalog and external-file transactions require a separate commit/rollback contract; persistent view SQL must not retain unbound parameters."
    },
    {
      "id": "DBSQL-002",
      "classification": "intentional_deviation",
      "surface": "database/sql nested result values",
      "stable_sql_semantics": false,
      "summary": "LIST and STRUCT values are rejected by database/sql; the current public Chunk exposes their type metadata without nested element-value accessors.",
      "duckdb": "DuckDB language bindings can expose nested result values through binding-specific value types.",
      "fssql": "database/sql returns an explicit error for LIST/STRUCT cells. The native public Chunk exposes Type.Child/Type.Fields metadata; internal Vector/DataChunk supports nested values, but public nested value accessors are not currently available.",
      "rationale": "database/sql driver.Value has no lossless standard nested value representation. Converting nested values to ad-hoc strings would violate the no-hidden-semantic-downgrade invariant."
    },
    {
      "id": "DBSQL-003",
      "classification": "intentional_deviation",
      "surface": "database/sql exact wide numeric values",
      "stable_sql_semantics": false,
      "summary": "DECIMAL and HUGEINT cells are represented as exact base-10 strings at the database/sql boundary.",
      "duckdb": "DuckDB bindings may expose DECIMAL/HUGEINT through binding-specific exact numeric objects.",
      "fssql": "database/sql emits exact decimal text for DECIMAL and HUGEINT because driver.Value has no standard Int128/Decimal type; the native Chunk API retains exact physical values.",
      "rationale": "The string representation is lossless and limited to the row-oriented compatibility adapter; Core/Execution ABI remains the engine's own Vector/DataChunk types."
    },
    {
      "id": "PERF-001",
      "classification": "bug",
      "surface": "production remote scan pushdown performance",
      "stable_sql_semantics": false,
      "summary": "Projection/filter/LIMIT pushdown now has an implementation and small-scale tests, but the million-row physical-I/O acceptance has not been re-run after the remediation.",
      "duckdb": "Projected and prunable scans can avoid reading unrelated columns and row groups.",
      "fssql": "The current branch maps projection/filter/limit into the Parquet runtime and has focused tests for projection mapping and early row-group stop. The last million-row report predates these changes and measured approximately the entire 300 MB source for narrow projection, LIMIT 100 and empty predicates.",
      "rationale": "Keep the defect open until post-remediation large-file acceptance directly measures physical I/O for projection, row-group pruning and safe LIMIT. Unit tests and optimizer plans alone are insufficient evidence."
    },
    {
      "id": "MEM-001",
      "classification": "bug",
      "surface": "default CSV and NDJSON large-file resource envelope",
      "stable_sql_semantics": false,
      "summary": "Bounded serial-window scanning is implemented and covered by focused CSV/NDJSON tests, but the original large production fixtures have not been re-run under 64 MiB and default 256 MiB budgets.",
      "duckdb": "Text readers can stream large sources without requiring a whole-file input buffer.",
      "fssql": "The current branch uses bounded serial range reads and tests that normal scans do not request the whole file, including oversized-record expansion and cleanup paths. The prior 283/344 MB failure report predates this remediation.",
      "rationale": "Keep the defect open until the original and replacement >budget fixtures complete under 64 MiB and 256 MiB managed-memory budgets with measured cleanup. Small fixtures prove the implementation shape, not the large-file acceptance gate."
    },
    {
      "id": "SQL-SUBQUERY-001",
      "classification": "unsupported_feature",
      "surface": "general correlated and nested scalar subqueries",
      "stable_sql_semantics": false,
      "summary": "Equality and parameter-domain EXISTS/IN/scalars, relation propagation, outer-owned aggregates, lateral derived inputs and nested scalar dependencies are supported; full subquery grammar and operator coverage remain limited.",
      "duckdb": "DuckDB accepts derived tables, aggregate/scalar combinations and correlated or nested scalar subqueries.",
      "fssql": "Parameter domains support non-equality predicates, constant per-domain LIMIT/OFFSET, nested references, empty global aggregates/HAVING, derived tables/CTEs, UNION ALL, JOIN ON subqueries, outer-owned aggregates and explicit/implicit INNER/CROSS/LEFT lateral derived inputs. Non-correlated scalar dependencies are prepared bottom-up. Dynamic table-function arguments and quantified ANY/ALL remain unsupported. Correlation through SAMPLE, non-constant correlated limits and disallowed dependent join types are rejected as in DuckDB 2.0.0.",
      "rationale": "The implementation reuses materialization, NULL-safe hash joins, grouping and partitioned row numbers. Full operator coverage remains future work; candidate pairs without usable hash keys still require a cross product/filter with a managed-memory build side."
    }
  ]
}
